name: Update contribution artwork

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'
      - 'scripts/style_activity.py'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: profile-activity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate real contribution route
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/raw-snake.svg
      - name: Apply profile artwork styles
        run: |
          python scripts/style_activity.py dist/raw-snake.svg --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python build_readme.py
      - name: Commit artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-light.svg assets/activity-dark.svg assets/activity.json README.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: update contribution artwork'
          git pull --rebase
          git push
